{% extends "base.html" %}
{% block title %}Image — Calypso{% endblock %}
{% block content %}
<section class="card">
  <h1>Generate image</h1>
  <p class="hint">Pick a reference, write a prompt, choose an image model.</p>
  <form
    hx-post="/image/submit"
    hx-target="#image-status"
    hx-swap="innerHTML"
    class="form"
  >
    <label>Reference
      <select name="ref_id">
        <option value="">— None —</option>
        {% for r in references %}
          <option value="{{ r.id }}">{{ r.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Model
      <input name="model" value="flux-pro/v1.1" />
    </label>
    <label>Aspect ratio
      <select name="aspect_ratio">
        <option>1:1</option><option>16:9</option><option>9:16</option>
        <option>4:3</option><option>3:4</option>
      </select>
    </label>
    <label>Number of images
      <input name="num_images" type="number" min="1" max="4" value="1" />
    </label>
    <label>Prompt
      <textarea name="prompt" rows="3" required></textarea>
    </label>
    <button type="submit">Generate</button>
  </form>
  <div id="image-status"></div>
</section>
{% endblock %}
